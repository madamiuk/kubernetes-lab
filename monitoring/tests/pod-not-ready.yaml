apiVersion: v1
kind: Pod
metadata:
  name: pod-not-ready-test
  namespace: monitoring
  labels:
    app: pod-not-ready-test
    purpose: alerting-lab
spec:
  containers:
    - name: nginx
      image: nginx:stable-alpine
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "64Mi"
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 1
        initialDelaySeconds: 5
        periodSeconds: 10
