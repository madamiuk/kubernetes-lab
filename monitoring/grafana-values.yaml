# K8S-025 - Grafana monitoring laboratory
# Helm chart: grafana-community/grafana
# Chart version: 14.4.0
# Application version: 13.3.0

replicas: 1

image:
  registry: docker.io
  repository: grafana/grafana
  tag: "13.3.0-distroless"
  pullPolicy: IfNotPresent

# Existing Kubernetes Secret - never store passwords in Git.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "512Mi"

persistence:
  type: pvc
  enabled: true
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# Provision the Prometheus datasource automatically.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false

# Provision dashboards managed by Helm.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubernetes-lab
        orgId: 1
        folder: Kubernetes Lab
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/kubernetes-lab
