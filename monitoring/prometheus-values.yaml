# K8S-025 - Prometheus monitoring laboratory
# Helm chart: prometheus-community/prometheus
# Chart version: 29.45.1

server:
  replicaCount: 1
  retention: "3d"

  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "400m"
      memory: "768Mi"

  persistentVolume:
    enabled: true
    storageClass: standard
    size: 2Gi

configmapReload:
  prometheus:
    image:
      repository: quay.io/prometheus-operator/prometheus-config-reloader
      tag: "v0.94.2"
      pullPolicy: IfNotPresent

    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"

alertmanager:
  enabled: true
  replicaCount: 1

  persistence:
    enabled: false

  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

  configmapReload:
    enabled: true
    image:
      repository: quay.io/prometheus-operator/prometheus-config-reloader
      tag: v0.94.2
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: "30m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

prometheus-pushgateway:
  enabled: false

serverFiles:
  alerting_rules.yml:
    groups:
      - name: kubernetes-health
        rules:
          - alert: KubernetesPodNotReady
            expr: |
              (
                kube_pod_status_ready{condition="false"} == 1
              )
              and on (namespace, pod, uid)
              (
                kube_pod_status_phase{phase=~"Pending|Running"} == 1
              )
            for: 5m
            labels:
              severity: warning
              environment: lab
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
              description: "The Kubernetes Pod has remained NotReady for at least five minutes."

          - alert: KubernetesNodeMemoryPressure
            expr: |
              kube_node_status_condition{
                condition="MemoryPressure",
                status="true"
              } == 1
            for: 5m
            labels:
              severity: warning
              environment: lab
            annotations:
              summary: "Node {{ $labels.node }} reports MemoryPressure"
              description: "The Kubernetes node has reported MemoryPressure for at least five minutes."
