apiVersion: v1
kind: Pod
metadata:
  name: storage-test
  namespace: lab-apps
  labels:
    app: storage-test
spec:
  restartPolicy: Never
  containers:
    - name: storage-test
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - |
          echo "Persistent Volume test container started"
          sleep 3600
      volumeMounts:
        - name: persistent-data
          mountPath: /data
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "32Mi"
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: lab-data-pvc
