apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: lab-apps
  labels:
    app: rbac-lab
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: lab-apps
roleRef:
  kind: Role
  name: pod-reader-role
  apiGroup: rbac.authorization.k8s.io
