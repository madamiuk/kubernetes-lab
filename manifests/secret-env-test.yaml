apiVersion: v1
kind: Pod
metadata:
  name: secret-env-test
  namespace: lab-apps
  labels:
    app: secret-env-test
spec:
  restartPolicy: Never
  containers:
    - name: secret-test
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - |
          echo "Secret environment test started"
          sleep 3600
      env:
        - name: APP_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-credentials
              key: username
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-credentials
              key: password
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "32Mi"
