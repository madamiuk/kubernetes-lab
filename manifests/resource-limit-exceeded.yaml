apiVersion: v1
kind: Pod
metadata:
  name: resource-limit-exceeded
  namespace: resource-lab
  labels:
    app: resource-lab
    test: limit-exceeded
spec:
  restartPolicy: Never
  containers:
    - name: resource-test
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - |
          echo "This Pod should be rejected by LimitRange"
          sleep 3600
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "512Mi"
