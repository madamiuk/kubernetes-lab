apiVersion: v1
kind: Pod
metadata:
  name: nginx-readiness-test
  namespace: lab-apps
  labels:
    app: nginx-readiness-test
spec:
  containers:
    - name: nginx
      image: nginx:stable-alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
        successThreshold: 1
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-readiness-test
  namespace: lab-apps
spec:
  type: ClusterIP
  selector:
    app: nginx-readiness-test
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
