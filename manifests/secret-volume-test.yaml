apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-test
  namespace: lab-apps
  labels:
    app: secret-volume-test
spec:
  restartPolicy: Never
  containers:
    - name: secret-test
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - |
          echo "Secret volume test started"
          sleep 3600
      volumeMounts:
        - name: credentials-volume
          mountPath: /etc/app-credentials
          readOnly: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "32Mi"
  volumes:
    - name: credentials-volume
      secret:
        secretName: app-credentials
        defaultMode: 0400
