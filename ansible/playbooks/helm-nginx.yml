---
- name: Manage Nginx Helm release
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/config"
    kubernetes_context: kind-k8s-lab

    helm_release_name: nginx-ansible-helm
    helm_namespace: ansible-lab
    helm_chart_path: "{{ playbook_dir }}/../../charts/nginx-lab"
    helm_values_path: "{{ playbook_dir }}/../helm/nginx-values.yml"

  tasks:
    - name: Ensure Nginx Helm release is deployed
      kubernetes.core.helm:
        name: "{{ helm_release_name }}"
        chart_ref: "{{ helm_chart_path }}"
        release_namespace: "{{ helm_namespace }}"
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ kubernetes_context }}"
        values_files:
          - "{{ helm_values_path }}"
        release_state: present
        wait: true
        wait_timeout: 2m
      register: nginx_helm_result

    - name: Display Helm release result
      ansible.builtin.debug:
        msg:
          - "Release: {{ helm_release_name }}"
          - "Namespace: {{ helm_namespace }}"
          - "Changed: {{ nginx_helm_result.changed }}"
